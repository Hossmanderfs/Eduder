  <rect x="480" y="323" width="280" height="50" rx="4" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="490" y="337" fill="#C8102E" font-size="9" font-weight="600">[alt] invalida → intentos++ / bloquear si ≥5</text>
  <text x="490" y="353" fill="#C8102E" font-size="9">→ return 401 "Credenciales incorrectas"</text>
  <text x="490" y="365" fill="#C8102E" font-size="9">[else] limpiar intentos</text>

