  <line x1="525" y1="1036" x2="740" y2="1036" stroke="#003DA5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="632" y="1031" text-anchor="middle" fill="#1E293B" font-size="10">5. findAll ordenado por xp_semana DESC</text>

  <line x1="750" y1="1058" x2="535" y2="1058" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
