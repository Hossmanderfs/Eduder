  <line x1="930" y1="136" x2="930" y2="440" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Mensajes DS-01 -->
  <line x1="110" y1="160" x2="290" y2="160" stroke="#003DA5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="155" text-anchor="middle" fill="#1E293B" font-size="10">1. ingresar(correo, contrasena)</text>

  <line x1="300" y1="185" x2="500" y2="185" stroke="#003DA5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="180" text-anchor="middle" fill="#1E293B" font-size="10">2. login(correo, contrasena)</text>

  <line x1="510" y1="210" x2="710" y2="210" stroke="#003DA5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="205" text-anchor="middle" fill="#1E293B" font-size="10">3. findOne(correo)</text>

  <line x1="720" y1="235" x2="520" y2="235" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <text x="620" y="230" text-anchor="middle" fill="#C8102E" font-size="10">4. usuario || null</text>

  <!-- Alt bloqueado -->
  <rect x="480" y="248" width="280" height="50" rx="4" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="490" y="262" fill="#D97706" font-size="9" font-weight="600">[alt] bloqueado_hasta &gt; now()</text>
  <text x="490" y="278" fill="#D97706" font-size="9">→ return 429 "Cuenta bloqueada N min"</text>
  <text x="490" y="290" fill="#D97706" font-size="9">[else] continuar verificación</text>

  <line x1="510" y1="310" x2="710" y2="310" stroke="#003DA5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="305" text-anchor="middle" fill="#1E293B" font-size="10">5. bcrypt.compare(pass, hash)</text>

