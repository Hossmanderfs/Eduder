  <text x="715" y="380" text-anchor="middle" fill="#1E293B" font-size="10">6. jwt.sign(payload, secret)</text>

  <line x1="930" y1="405" x2="520" y2="405" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <text x="725" y="400" text-anchor="middle" fill="#059669" font-size="10">7. token JWT</text>

