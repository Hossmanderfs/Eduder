  <!-- Actores DS-01 -->
  <rect x="60" y="106" width="100" height="30" rx="6" fill="#C8102E"/>
  <text x="110" y="126" text-anchor="middle" fill="white" font-size="11" font-weight="600">:Estudiante</text>
